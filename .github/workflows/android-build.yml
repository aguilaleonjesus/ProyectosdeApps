name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Find debug APK
        id: apk
        shell: bash
        run: |
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$apk_path" ]]; then
            mapfile -t apks < <(find . -type f -path '*/build/outputs/apk/*' -name '*debug*.apk' | sort)
            if [[ ${#apks[@]} -eq 0 ]]; then
              echo "::error::No debug APK was generated."
              exit 1
            fi
            printf '%s\n' 'path<<RITMO_APK_PATHS' "${apks[@]}" 'RITMO_APK_PATHS' >> "$GITHUB_OUTPUT"
          else
            printf 'path=%s\n' "$apk_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ritmo-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
